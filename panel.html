<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helixis Copilot</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M6 1L11 6L6 11L1 6Z" fill="white" fill-opacity="0.92"/>
        </svg>
      </div>
      <span class="header-title">Helixis Copilot</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      Ready
    </div>
  </header>

  <!-- ── TAB BAR ──────────────────────────────────── -->
  <nav class="tab-bar">
    <button class="tab" data-tab="chat">Chat</button>
    <button class="tab" data-tab="reminders">
      Reminders<span class="badge" id="reminderBadge"></span>
    </button>
    <button class="tab" data-tab="actions">Actions</button>
    <button class="tab" data-tab="context">Context</button>
  </nav>

  <!-- ── VIEWS ────────────────────────────────────── -->
  <div class="views">

    <!-- CHAT ──────────────────────────────────────── -->
    <div class="view" id="view-chat">
      <div class="messages" id="messageList">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M11 2L20 11L11 20L2 11Z" fill="white" fill-opacity="0.9"/>
            </svg>
          </div>
          <div class="chat-empty-title">Helixis Copilot</div>
          <div class="chat-empty-desc">Capture page context from the Actions tab to get started.</div>
        </div>
      </div>
      <div class="input-bar">
        <input
          type="text"
          id="chatInput"
          placeholder="Message…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- REMINDERS ─────────────────────────────────── -->
    <div class="view" id="view-reminders">
      <div class="view-header">
        <span class="view-title">Reminders</span>
        <button class="icon-btn" id="addReminderBtn" title="Add reminder">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="view-inner">
        <div class="reminder-form" id="reminderForm" hidden>
          <input type="text"           id="reminderTitle" placeholder="Reminder title" />
          <input type="text"           id="reminderNote"  placeholder="Note (optional)" />
          <input type="datetime-local" id="reminderDue" />
          <div class="form-row">
            <button class="form-btn form-btn-primary"   id="reminderSave">Save</button>
            <button class="form-btn form-btn-secondary" id="reminderCancel">Cancel</button>
          </div>
        </div>
        <div id="remindersList"></div>
      </div>
    </div>

    <!-- ACTIONS ───────────────────────────────────── -->
    <div class="view" id="view-actions">
      <div class="view-inner">

        <div class="action-card primary-action" id="actionReadCtx" role="button" tabindex="0">
          <div class="action-icon accent">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M2.5 4.5h11M2.5 8h7.5M2.5 11.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="action-text">
            <div class="action-title">Read Page Context</div>
            <div class="action-desc">Extract visible text from the active tab</div>
          </div>
          <div class="action-tag active-tag">Active</div>
        </div>


      </div>
    </div>

    <!-- CONTEXT ───────────────────────────────────── -->
    <div class="view" id="view-context">
      <div class="view-inner">

        <div class="context-info-card">
          <div class="context-row">
            <span class="context-row-label">Site</span>
            <span class="context-row-value" id="ctxHostname">—</span>
          </div>
          <div class="context-row">
            <span class="context-row-label">Title</span>
            <span class="context-row-value" id="ctxTitle">—</span>
          </div>
          <div class="context-row">
            <span class="context-row-label">Captured</span>
            <span class="context-row-value" id="ctxTimestamp">—</span>
          </div>
        </div>

        <textarea
          class="ctx-textarea"
          id="ctxText"
          placeholder="No context captured yet. Use Read Page Context in the Actions tab."
          readonly
        ></textarea>

        <button class="refresh-btn" id="refreshCtxBtn">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M11 6.5A4.5 4.5 0 1 1 6.5 2a4.5 4.5 0 0 1 3.18 1.32M11 2v3H8"
                  stroke="currentColor" stroke-width="1.3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh Context
        </button>

      </div>
    </div>

  </div><!-- /.views -->

  <script src="panel.js"></script>
</body>
</html>
