<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helixis Copilot</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M6 1L11 6L6 11L1 6Z" fill="white" fill-opacity="0.92"/>
        </svg>
      </div>
      <span class="header-title">Helixis Copilot</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      Ready
    </div>
  </header>

  <!-- ── TAB BAR ──────────────────────────────────── -->
  <nav class="tab-bar">
    <button class="tab" data-tab="chat">Chat</button>
    <button class="tab" data-tab="tasks">
      Tasks<span class="badge" id="taskBadge"></span>
    </button>
    <button class="tab" data-tab="context">Context</button>
  </nav>

  <!-- ── VIEWS ────────────────────────────────────── -->
  <div class="views">

    <!-- CHAT ──────────────────────────────────────── -->
    <div class="view" id="view-chat">
      <div class="messages" id="messageList">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M11 2L20 11L11 20L2 11Z" fill="white" fill-opacity="0.9"/>
            </svg>
          </div>
          <div class="chat-empty-title">How can I help?</div>
          <div class="chat-empty-desc">Ask anything about the page you're viewing.</div>
        </div>
      </div>

      <!-- Quick Actions (above input) -->
      <div class="quick-actions" id="quickActions">
        <button class="quick-action-chip" id="qaReadContext" title="Capture page context">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 4.5h11M2.5 8h7.5M2.5 11.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Read Page
        </button>
        <button class="quick-action-chip disabled" title="Coming soon">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M3 12.5h10M8 3.5v7M5.5 6L8 3.5 10.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Summarize
        </button>
        <button class="quick-action-chip disabled" title="Coming soon">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <rect x="2.5" y="3" width="11" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 7h6M5 9.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Draft Reply
        </button>
      </div>

      <div class="input-bar">
        <input
          type="text"
          id="chatInput"
          placeholder="Message… or / for commands"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- TASKS (webhook-driven only) ────────────────── -->
    <div class="view" id="view-tasks">
      <div class="view-header">
        <span class="view-title">Tasks</span>
        <div class="task-filter-row">
          <button class="filter-chip active" data-filter="open">Open</button>
          <button class="filter-chip" data-filter="all">All</button>
        </div>
      </div>
      <div class="view-inner" id="tasksList">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- CONTEXT ───────────────────────────────────── -->
    <div class="view" id="view-context">
      <div class="view-inner">

        <div class="context-info-card">
          <div class="context-row">
            <span class="context-row-label">Site</span>
            <span class="context-row-value" id="ctxHostname">—</span>
          </div>
          <div class="context-row">
            <span class="context-row-label">Title</span>
            <span class="context-row-value" id="ctxTitle">—</span>
          </div>
          <div class="context-row">
            <span class="context-row-label">Captured</span>
            <span class="context-row-value" id="ctxTimestamp">—</span>
          </div>
        </div>

        <textarea
          class="ctx-textarea"
          id="ctxText"
          placeholder="No context captured yet. Use Read Page in the Chat tab."
          readonly
        ></textarea>

        <button class="refresh-btn" id="refreshCtxBtn">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M11 6.5A4.5 4.5 0 1 1 6.5 2a4.5 4.5 0 0 1 3.18 1.32M11 2v3H8"
                  stroke="currentColor" stroke-width="1.3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh Context
        </button>

      </div>
    </div>

  </div><!-- /.views -->

  <script src="panel.js"></script>
</body>
</html>
