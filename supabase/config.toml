# Helixis Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "YOUR_PROJECT_REF"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://YOUR_PROJECT_REF.supabase.co"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
file_size_limit = "10MB"
